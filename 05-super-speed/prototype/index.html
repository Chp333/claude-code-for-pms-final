<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatch Recovery Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5fa; --panel:#ffffff; --panel2:#f8fafc; --ink:#0f172a; --muted:#64748b; --line:#e3e8f0;
  --accent:#4f46e5; --accent-soft:#eef0ff; --teal:#0ea5a4; --good:#10b981; --good-soft:#e7f8f1;
  --warn:#f59e0b; --warn-soft:#fff6e5; --bad:#ef4444; --bad-soft:#fdecec; --shadow:0 10px 30px rgba(15,23,42,.08);
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1020; --panel:#121a2e; --panel2:#0f1628; --ink:#e6eaf5; --muted:#93a0b8; --line:#243049;
    --accent:#818cf8; --accent-soft:#1e2350; --good-soft:#0f2a22; --warn-soft:#2d2410; --bad-soft:#2e1416; --shadow:0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0b1020; --panel:#121a2e; --panel2:#0f1628; --ink:#e6eaf5; --muted:#93a0b8; --line:#243049;
  --accent:#818cf8; --accent-soft:#1e2350; --good-soft:#0f2a22; --warn-soft:#2d2410; --bad-soft:#2e1416; --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:12px 20px;background:color-mix(in srgb,var(--panel) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--teal));display:grid;place-items:center;color:#fff;font-weight:800}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:9px;font-weight:600}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-weight:600;font-size:12px;border:1px solid var(--line);background:var(--panel)}
.pill.old{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.new{background:var(--good-soft);color:var(--good);border-color:transparent}
.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:6px 10px;font-weight:600}
.layout{display:grid;grid-template-columns:380px 1fr;gap:18px;padding:18px 20px 120px;max-width:1700px;margin:0 auto}
@media (max-width:1180px){.layout{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
/* walkthrough */
.walk{padding:16px;position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto}
@media (max-width:1180px){.walk{position:static;max-height:none}}
.progress{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:6px 0 12px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--teal));border-radius:99px;transition:width .3s}
.stepsel{width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:inherit}
.rid{display:inline-block;font-weight:800;font-size:12px;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:7px;margin-right:6px}
.pri{display:inline-block;font-weight:700;font-size:11px;padding:2px 7px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.walk h2{font-size:19px;line-height:1.25;margin:10px 0 4px;letter-spacing:-.01em}
.grp{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.blk{margin-top:12px}
.blk h4{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.blk p{margin:0}
.jtbd{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:600;padding:3px 8px;border-radius:7px;background:var(--panel2);border:1px solid var(--line)}
.chip.g{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.w{background:var(--warn-soft);color:#b45309;border-color:transparent}
ul.tight{margin:0;padding-left:18px}
ul.tight li{margin:2px 0}
.ctrl{display:flex;gap:8px;margin-top:16px;position:sticky;bottom:-16px;background:var(--panel);padding:12px 0 4px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 14px;border-radius:11px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;flex:1}
.btn:disabled{opacity:.45;cursor:default}
details summary{cursor:pointer;font-weight:600;color:var(--muted);font-size:12px;margin-top:12px}
/* stage */
.stage{display:flex;flex-direction:column;gap:18px;min-width:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media (max-width:900px){.row{grid-template-columns:1fr}}
.paneh{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:0 4px 8px}
.paneh .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
/* console window */
.win{overflow:hidden}
.titlebar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--panel2);border-bottom:1px solid var(--line)}
.tl{width:11px;height:11px;border-radius:50%}
.url{margin-left:10px;flex:1;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px 10px;color:var(--muted);font-size:12px}
.con{display:grid;grid-template-columns:64px 1fr;min-height:520px;position:relative}
.nav{background:var(--panel2);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0}
.nav span{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--muted);font-size:16px}
.nav span.on{background:var(--accent-soft);color:var(--accent)}
.cmain{padding:16px 18px;min-width:0}
.chead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chead h3{margin:0;font-size:18px;letter-spacing:-.01em}
.who{font-size:12px;color:var(--muted)}
.raise{display:flex;gap:6px;margin-left:auto}
.raise select{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:6px 8px;font:inherit;font-size:13px}
.banner{display:flex;align-items:center;gap:10px;border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13px}
.banner.warn{background:var(--warn-soft)} .banner.bad{background:var(--bad-soft)} .banner.info{background:var(--accent-soft)} .banner.good{background:var(--good-soft)}
.banner b{font-weight:700}
.banner .act{margin-left:auto;display:flex;gap:6px}
.sbtn{border:0;border-radius:9px;padding:6px 10px;font-weight:700;font-size:12px;background:var(--ink);color:var(--panel)}
.sbtn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.filters{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:12px}
.fchip{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600}
.fchip.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.fbadge{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--warn);color:#111}
.fbadge.small{background:transparent;color:var(--muted);font-weight:600;padding:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:12px}
.rcard{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--panel2)}
.rtop{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#fff}
.rname{font-weight:700}
.rarea{font-size:12px;color:var(--muted)}
.status{margin-left:auto;font-weight:800;font-size:13px;padding:5px 10px;border-radius:9px}
.status.small{font-size:11px;padding:3px 7px}
.st-available{background:var(--good-soft);color:var(--good)} .st-engaged{background:var(--accent-soft);color:var(--accent)}
.st-paused{background:var(--warn-soft);color:#b45309} .st-unreachable{background:var(--bad-soft);color:var(--bad)}
.live{margin-top:10px;border-radius:10px;padding:8px 10px;background:linear-gradient(90deg,var(--accent-soft),transparent);display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:10px}
.standing{margin-top:8px;font-size:12px;padding:7px 9px;border-radius:9px;background:var(--panel);border:1px dashed var(--line)}
.flag{margin-top:8px;font-size:12px;font-weight:700;color:#b45309}
.feed{margin-top:14px}
.feed h5{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.inc{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;font-size:13px;background:var(--panel)}
.inc .tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.inc .pin{font-size:11px;font-weight:700;color:var(--accent)}
.toasts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.toasts:empty{display:none}
.toast{background:var(--ink);color:var(--panel);border-radius:12px;padding:10px 12px;font-size:13px;animation:slide .3s ease;display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline}
.toast small{opacity:.75}
@keyframes slide{from{transform:translateY(-8px);opacity:0}}
.modal{position:absolute;inset:0;background:rgba(15,23,42,.35);display:grid;place-items:center;z-index:6}
.modal .box{background:var(--panel);border-radius:16px;padding:16px;width:min(360px,90%);box-shadow:var(--shadow)}
.modal h4{margin:0 0 6px}
.reasons{display:flex;flex-direction:column;gap:6px;margin:10px 0}
/* phone */
.phonewrap{display:flex;flex-direction:column;align-items:center}
.phone{width:310px;height:640px;border-radius:46px;background:#05070d;padding:12px;box-shadow:0 30px 60px rgba(15,23,42,.25),inset 0 0 0 2px #2a3142;position:relative}
.screen{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,#1d2547 0%,#0b0f1a 60%);color:#e8ecf7}
.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:96px;height:26px;background:#000;border-radius:16px;z-index:3}
.sbar{display:flex;justify-content:space-between;padding:12px 24px 0;font-size:12px;font-weight:700;color:#cfd6e8}
.pcontent{position:absolute;inset:44px 0 0 0;padding:14px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.pcard{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:12px}
.pcard h6{margin:0 0 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#93a0c4}
.ptitle{font-size:22px;font-weight:800;letter-spacing:-.02em}
.toggle{display:flex;justify-content:space-between;align-items:center}
.sw{width:44px;height:26px;border-radius:99px;background:#10b981;position:relative}
.sw::after{content:"";position:absolute;right:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff}
.sw.off{background:#475569}.sw.off::after{right:auto;left:3px}
.plist div{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.plist em{font-style:normal;color:#93a0c4;font-size:11px}
.o-yes{color:#34d399}.o-no{color:#fbbf24}.o-miss{color:#f87171}.o-nc{color:#93a0c4}
.alert{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:radial-gradient(90% 60% at 50% 35%,rgba(99,102,241,.55),rgba(11,15,26,.98) 70%)}
.alert.full{animation:flash 1.2s infinite}
@keyframes flash{50%{background:radial-gradient(90% 60% at 50% 35%,rgba(99,102,241,.85),rgba(11,15,26,.98) 70%)}}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;position:relative}
.ring b{font-size:44px;font-weight:800}
.ring small{display:block;font-size:11px;color:#c7cfe6;margin-top:-6px}
.abtns{display:flex;gap:14px;align-items:center;width:100%;justify-content:space-between;margin-top:8px}
.pbtn{border:0;border-radius:18px;padding:14px 18px;font-weight:800;font-size:15px}
.pbtn.yes{background:#10b981;color:#04120c;flex:1}
.pbtn.no{background:rgba(255,255,255,.12);color:#e8ecf7;padding:10px 14px;font-size:13px}
.pbtn.plain{background:rgba(255,255,255,.12);color:#e8ecf7;width:100%}
.lock{position:absolute;inset:0;z-index:2;padding:70px 14px 20px;background:linear-gradient(180deg,#141b33,#05070d)}
.clock{text-align:center;font-size:58px;font-weight:300;letter-spacing:-.03em}
.date{text-align:center;color:#aab4d1;margin-top:-6px}
.notif{margin-top:30px;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);border-radius:20px;padding:12px}
.notif .app{display:flex;align-items:center;gap:8px;font-size:12px;color:#c7cfe6}
.notif .app i{width:20px;height:20px;border-radius:6px;background:#4f46e5;display:inline-block}
.notif .t{font-weight:700;margin-top:6px}
.notif .acts{display:flex;gap:8px;margin-top:10px}
.fp{width:64px;height:64px;border-radius:50%;border:2px solid #34d399;display:grid;place-items:center;font-size:28px;margin:18px auto 0;background:rgba(16,185,129,.12)}
.ptoast{position:absolute;left:12px;right:12px;top:46px;z-index:4;background:#e8ecf7;color:#0b0f1a;border-radius:16px;padding:11px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;animation:slide .3s}
.ptoast button{margin-left:auto;border:0;border-radius:10px;padding:7px 10px;font-weight:800;background:#0b0f1a;color:#fff}
.watch{position:absolute;right:-18px;top:96px;z-index:5;width:64px;height:76px;border-radius:18px;background:#05070d;border:2px solid #2a3142;display:grid;place-items:center;color:#a5b4fc;font-size:11px;font-weight:700;text-align:center;animation:buzz .25s infinite}
@keyframes buzz{50%{transform:translateX(2px)}}
.nosignal{background:#7f1d1d;color:#fee2e2;border-radius:12px;padding:6px 10px;font-size:12px;font-weight:700;text-align:center}
.pselect{margin-top:10px;display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.pselect select{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:5px 8px;font:inherit;font-size:12px}
/* engine */
.eng{padding:14px 16px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:9px;font-weight:700;font-size:13px}
.tabs button.on{background:var(--accent-soft);color:var(--accent)}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
table.t th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:8px;border-bottom:1px solid var(--line)}
table.t tr.top td{background:var(--good-soft)}
.num{font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.weights{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.wchip{border-radius:10px;padding:6px 10px;background:var(--panel2);border:1px solid var(--line);font-size:12px;font-weight:600}
.wchip b{font-size:15px;margin-right:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel2)}
.tile .k{font-size:12px;color:var(--muted);font-weight:600}
.tile .v{font-size:24px;font-weight:800;letter-spacing:-.02em}
.tile .s{font-size:12px;color:var(--muted)}
.meter{position:relative;height:16px;border-radius:99px;background:linear-gradient(90deg,var(--bad-soft),var(--warn-soft),var(--good-soft));margin:26px 0 30px}
.meter .mk{position:absolute;top:-6px;width:3px;height:28px;border-radius:2px;background:var(--ink)}
.meter .mk span{position:absolute;top:30px;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap;color:var(--muted);font-weight:600}
.meter .dotm{position:absolute;top:-5px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:var(--accent);border:3px solid var(--panel);box-shadow:var(--shadow);transition:left .4s}
.meter .dotm.raw{background:var(--muted)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
.log{max-height:240px;overflow:auto;font-size:12.5px}
.log div{padding:5px 0;border-bottom:1px dashed var(--line);display:flex;gap:10px}
.log code{color:var(--muted);font-family:ui-monospace,Consolas,monospace;font-size:11.5px;min-width:44px}
.swl{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.swi{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:11px;padding:8px 10px;background:var(--panel2);font-size:13px}
.swi .sw{transform:scale(.8);flex:none}
.swi .sw.off{background:#94a3b8}
.swi small{display:block;color:var(--muted);font-size:11px}
.chart{display:flex;align-items:flex-end;gap:8px;height:150px;padding:8px 0;border-bottom:1px solid var(--line)}
.chart div{flex:1;background:var(--accent);border-radius:6px 6px 0 0;position:relative;opacity:.85}
.chart div.post{background:var(--warn)}
.chart div span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700}
.chartx{display:flex;gap:8px;font-size:10.5px;color:var(--muted)}
.chartx span{flex:1;text-align:center}
.intake{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:900px){.intake{grid-template-columns:1fr}}
.ichart{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel2);min-width:0}
.ichart.wide{grid-column:1/-1}
.ih{font-weight:700;margin-bottom:22px}
.chart.daily{gap:3px}.chartx.daily{gap:3px;font-size:9.5px;line-height:1.15}
.chart.daily div span{font-size:9.5px}
.chart div.hl{background:var(--bad);opacity:1}.chart div.hl2{background:var(--good);opacity:1}
.chartx span.rel{color:var(--bad);font-weight:800}
.alegend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:-10px 0 8px}
.alegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.arow{display:grid;grid-template-columns:110px 1fr 74px;gap:10px;align-items:center;font-size:12.5px;padding:3px 0}
.arow .ab{display:flex;flex-direction:column;gap:2px}
.arow .ab i{display:block;height:7px;border-radius:4px}
.arow .ac{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.arow.flat .an,.arow.flat .ac{color:var(--good);font-weight:800}
.ok{color:var(--good);font-weight:800}.no{color:var(--bad);font-weight:800}
/* caption + spotlight */
.caption{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:40;width:min(980px,calc(100% - 32px));background:var(--ink);color:var(--panel);border-radius:18px;padding:14px 18px;box-shadow:0 20px 50px rgba(0,0,0,.3);display:flex;gap:14px;align-items:center}
.caption .cid{font-weight:800;font-size:12px;background:rgba(255,255,255,.14);padding:4px 8px;border-radius:8px;white-space:nowrap}
.caption .ctext{font-size:15px;font-weight:500;flex:1}
.caption .speed{font-size:12px;opacity:.75;white-space:nowrap}
.caption .capnext{border:0;border-radius:11px;padding:9px 14px;font-weight:800;background:var(--accent);color:#fff;white-space:nowrap;animation:spotpulse 1.4s infinite}

.spotbox{position:fixed;z-index:35;pointer-events:none;border:3px solid var(--accent);border-radius:16px;

  transition:left .25s ease,top .25s ease,width .25s ease,height .25s ease;animation:spotpulse 1.4s infinite}
@keyframes spotpulse{50%{border-color:var(--teal);box-shadow:0 0 0 10px color-mix(in srgb,var(--teal) 22%,transparent),0 0 0 100vmax rgba(15,23,42,.22)}}
.spotbox::before{content:"Look here";position:absolute;top:-27px;left:-3px;background:var(--accent);color:#fff;font-size:11px;font-weight:800;padding:3px 9px;border-radius:8px 8px 8px 0;letter-spacing:.04em;white-space:nowrap}
#pauseBtn.on{background:var(--warn);color:#111}
.hidden{display:none!important}
.free label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin:10px 0 4px}
.free select,.free input{width:100%;padding:7px 9px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:inherit}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;gap:8px;flex-wrap:wrap}
.eng{overflow-x:auto}

  .top{flex-wrap:wrap;padding:10px 16px;gap:8px}
  .brand small,#speedSeg,#rulesPill{display:none}

  .watch{display:none}
  .con{grid-template-columns:1fr}.nav{display:none}
  
  .caption{flex-wrap:wrap}
}

<body>
<header class="top">
  <div class="brand"><div class="logo">R</div><div>Rook Dispatch<small>4.2 recovery · interactive prototype</small></div></div>
  <div class="seg" id="modeSeg"><button data-mode="walk" class="on">Walkthrough</button><button data-mode="free">Free play</button></div>
  <div class="grow"></div>
  <span class="pill" id="rulesPill"></span>
  <div class="seg" id="speedSeg" title="Pause / simulation speed"><button id="pauseBtn" title="Pause or resume the simulation">❚❚</button><button data-speed="1" class="on">1×</button><button data-speed="4">4×</button><button data-speed="10">10×</button></div>
  <button class="iconbtn" id="themeBtn" title="Switch light/dark">◐</button>

<div class="layout">
  <aside class="card walk" id="walk"></aside>
  <section class="stage">
    <div class="row">
      <div>
        <div class="paneh"><span class="dot"></span><span id="conLabel">Handler console</span></div>

      </div>
      <div class="phonewrap">
        <div class="paneh"><span class="dot" style="background:var(--teal)"></span><span id="phoneLabel">Responder phone</span></div>
        <div class="phone" id="phone"></div>
      </div>
    </div>
    <div>
      <div class="paneh"><span class="dot" style="background:var(--warn)"></span>Behind the scenes · routing engine</div>
      <div class="card eng" id="engine"></div>
    </div>
  </section>
</div>
<div class="spotbox hidden" id="spotbox"></div>
<div class="caption hidden" id="caption"><span class="cid" id="capId"></span><span class="ctext" id="capText"></span><span class="speed" id="capSpeed"></span><button class="capnext hidden" id="capNext" title="Continue (Space or →)">Continue ▸</button></div>

<script>
/* ============================================================
   DATA (from rook-database, post-4.2 records, 12 Aug – 6 Sep)
   ============================================================ */
const DAY0 = Date.UTC(2026,7,12);              // day 0 = 12 Aug 2026 (4.2 release)
const dayLabel = d => new Date(DAY0 + d*864e5).toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'UTC'});
const NEAR = {
  'Old Town':{'Midtown':12,'Hillcrest':15,'Lakeshore':16,'Eastgate':22},
  'Midtown':{'Old Town':12,'Hillcrest':13,'Eastgate':14},
  'Hillcrest':{'Midtown':13,'Old Town':15},
  'Eastgate':{'Midtown':14,'Foundry Row':16,'Old Town':22},
  'Lakeshore':{'Old Town':16},
  'Foundry Row':{'Eastgate':16,'Uptown':18},
  'Uptown':{'Foundry Row':18},
};
const AREAS = ['Old Town','Hillcrest','Eastgate','Midtown','Lakeshore','Foundry Row'];
const TAGS = ['structural-entry','flight','aquatic','cold-weather','hazmat-tolerant','crowd-management','de-escalation'];
const COLORS = {vesper:'#8b5cf6',nightwell:'#0ea5e9',vantage:'#f59e0b',longcast:'#14b8a6',mite:'#ec4899',gale:'#6366f1',bulwark:'#64748b',farlight:'#f97316',undertow:'#06b6d4'};
// Vesper's real post-4.2 record: 5 taken, 3 turned down, 9 missed (day = days after 12 Aug)
const VESPER = [[1,'miss'],[2,'yes'],[2,'miss'],[3,'yes'],[3,'no'],[3,'yes'],[4,'miss'],[4,'miss'],[4,'yes'],[5,'no'],[7,'miss'],[11,'miss'],[11,'yes'],[11,'miss'],[12,'no'],[14,'miss'],[20,'miss']];
const BASE = [
  {id:'vesper',  name:'Vesper',          area:'Old Town',   home:2, handler:'Aunt Dot',       tags:['structural-entry','de-escalation'], old:0.00, rec:VESPER,    usual:13.7, week:4.6,  bot:{act:'yes',after:66}},
  {id:'nightwell',name:'Nightwell',      area:'Midtown',    home:3, handler:'Marjorie Sung',  tags:['crowd-management','de-escalation'], old:0.92, counts:[47,15,8], usual:15.1, week:18.9, bot:{act:'yes',after:18}},
  {id:'vantage', name:'Captain Vantage', area:'Hillcrest',  home:3, handler:'Mr. Ambrose',    tags:['structural-entry','flight'],        old:0.88, counts:[42,11,6], usual:12.1, week:15.9, bot:{act:'yes',after:40}},
  {id:'longcast',name:'The Longcast',    area:'Lakeshore',  home:3, handler:'Graham Petrov',  tags:['aquatic','cold-weather'],           old:0.80, counts:[21,6,5],  usual:7.1,  week:8.6,  bot:{act:'no', after:20}},
  {id:'mite',    name:'Meteor Mite',     area:'Eastgate',   home:3, handler:'Kip',            tags:['flight','crowd-management'],        old:0.00, counts:[3,3,8],   usual:11.1, week:3.8,  bot:{act:'yes',after:66}},
  {id:'gale',    name:'The Gale',        area:'Eastgate',   home:4, handler:'Kip',            tags:['flight','aquatic'],                 old:1.00, counts:[48,13,8], usual:13.0, week:18.6, bot:{act:'yes',after:15}},
  {id:'bulwark', name:'Sgt. Bulwark',    area:'Foundry Row',home:3, handler:'Halloran',       tags:['structural-entry','hazmat-tolerant'],old:0.90,counts:[26,6,7],  usual:9.0,  week:10.5, bot:{act:'yes',after:30}},
  {id:'farlight',name:'Farlight',        area:'Uptown',     home:3, handler:'Linda Pruitt',   tags:['flight'],                           old:0.00, counts:[2,2,7],   usual:11.9, week:3.0,  bot:{act:'yes',after:66}},
  {id:'undertow',name:'The Undertow',    area:'Harborside', home:3, handler:'Desmond Okafor', tags:['aquatic'],                          old:0.00, counts:[3,2,9],   usual:11.9, week:3.8,  bot:{act:'yes',after:66}},
];
const HANDLERS = ['Aunt Dot','Kip','Mr. Ambrose','Marjorie Sung'];
const FLOOR = 0.6, PRIOR_N = 5, PRIOR_P = 0.75;
const W = {no:0.5, miss:1.0, release:1.5};
const SWITCHES = [
  ['cheapNo','DR-01','A "no" costs less than a miss'],
  ['window','DR-02','Score over a time window (recovers)'],
  ['floor','DR-03','Floor on the score (0.6)'],
  ['boost','DR-04','Recovery boost (accepts ×3 below the middle)'],
  ['outArea','DR-05','Out-of-area declines don\'t count'],
  ['release','DR-07','Release after accepting is costliest'],
  ['streak','DR-10','Streak → confirm availability'],
  ['move15','DR-11','Undelivered after 15 s → move on, never counted'],
  ['lock','DR-13','Answer from lock screen (generic + biometric)'],
  ['alert','DR-14','Hard-to-miss alert + watch'],
  ['countdown','DR-15','Countdown on the alert'],
  ['retry','DR-16','Retry delivery with the same ID'],
  ['undo','DR-17','Change a "no" to accept within 5 s'],
  ['escalate','DR-19','Keep going + escalate after 3 pings'],
  ['capFilter','DR-20','Required tags filter (phase 2)'],
  ['overlap','DR-21','Overlapping offers (deferred)'],
  ['load','DR-22','Load monitor flag'],
  ['notify','DR-23','Tell the handler when pinged'],
  ['standing','DR-24','Standing in plain words'],
  ['filterSafe','DR-25','Filters: warn, restore, never hide own'],
];
const DEFAULT_SW = Object.fromEntries(SWITCHES.map(s=>[s[0],true]));
DEFAULT_SW.capFilter = false; DEFAULT_SW.overlap = false;

/* ============================================================
   STATE
   ============================================================ */
let S;            // world state
let MODE = 'walk';
let STEP = 0;
let RUN = null;   // running script token
let renderQueued = false;

function seeded(n){ let x = n*9301+49297; return ()=>{ x=(x*9301+49297)%233280; return x/233280; }; }
function spread(id,[y,n,m]){
  const types=[...Array(y).fill('yes'),...Array(n).fill('no'),...Array(m).fill('miss')];
  const rnd=seeded(id.length*7+y); for(let i=types.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[types[i],types[j]]=[types[j],types[i]];}
  return types.map((t,i)=>[Math.floor(i*25/types.length),t]);
}
function freshWorld(cfg={}){
  const R = BASE.map(b=>{
    const rec = (b.rec || spread(b.id,b.counts)).map(([day,type])=>({day,type,credit:type==='yes'?1:0,src:'history'}));
    return {...b, tags:[...b.tags], bot:{...b.bot}, out:rec, status:'available', engaged:false, online:true, delay:2, dropFirst:false, watch:false,
            streakMiss:0, streakNo:0, streakUnd:0, deliveredHistory:true};
  });
  S = {
    fixed: cfg.fixed ?? true, sw:{...DEFAULT_SW, ...(cfg.sw||{})}, windowDays: cfg.windowDays || 30,
    R, callouts:[], pings:[], log:[], now:0, today:26, speed:1,
    handler: cfg.handler || 'Aunt Dot', phoneRid: cfg.phone || 'vesper', phoneLocked: !!cfg.locked,
    tab: cfg.tab || 'ranking', ops: cfg.ops || null, toasts:[], banners:[], messages:[], modal:null,
    undo:null, phoneNote:null, unlocking:null, preview: cfg.preview || {area:'Old Town', need:[]},
    filters:{active:cfg.filters||[], restoreFrom:null, user:'main'}, coverFilters:[], signedIn:'main',
    spot:null, nextId:12, opsData:{}, maxOpen:0,
  };
  if (cfg.prep) cfg.prep(S);
  pushLog(`World reset · ${S.fixed?'with fixes':'4.2 as shipped'}`);
}
const byId = id => S.R.find(r=>r.id===id);
function pushLog(text){ S.log.unshift({t:S.now,text}); if(S.log.length>80) S.log.pop(); }
const fmtT = s => { s=Math.max(0,Math.round(s)); return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; };
const on = k => S.fixed && S.sw[k];

/* ============================================================
   SCORING
   ============================================================ */
function counted(o){ return !['no_out','miss_late','undelivered','release_ex','withdrawn'].includes(o.type); }
function rawScore(r, today=S.today, extra=[]){
  const from = on('window') ? today - S.windowDays : -9999;
  let cr=0,no=0,mi=0,rel=0;
  for (const o of [...r.out,...extra]){
    if (o.day <= from) continue;
    if (o.type==='yes' && !o.released) cr += o.credit;
    else if (o.type==='no') no += 1;
    else if (o.type==='miss') mi += 1;
    else if (o.type==='release') rel += 1;
  }
  const noW = on('cheapNo') ? W.no : W.miss;
  return (cr + PRIOR_P*PRIOR_N) / (cr + noW*no + W.miss*mi + W.release*rel + PRIOR_N);
}
function middle(){ const xs=S.R.map(r=>rawScore(r)).sort((a,b)=>a-b); const n=xs.length; return n%2?xs[(n-1)/2]:(xs[n/2-1]+xs[n/2])/2; }
function histScore(r){ if(!S.fixed) return r.old; const s=rawScore(r); return on('floor')?Math.max(FLOOR,s):s; }
function acceptsToMiddle(r, boost){
  const mid = middle(); let extra=[]; let n=0;
  while (rawScore(r,S.today,extra) < mid && n<80){ extra.push({day:S.today,type:'yes',credit: boost?3:1}); n++; }
  return n;
}
function backToNormalDay(r){
  const mid = middle();
  for (let d=S.today; d<S.today+60; d++){ if (rawScore(r,d) >= mid) return d; }
  return null;
}
function record(r, type, extra={}){
  if (!S.fixed){
    if (type==='yes') r.old = Math.min(1, r.old+0.08);
    else if (['no','miss','undelivered','no_out','miss_late'].includes(type)) r.old = Math.max(0, r.old-0.12);
    return null;
  }
  let credit = 0;
  if (type==='yes') credit = (on('boost') && rawScore(r) < middle()) ? 3 : 1;
  const o = {day:S.today, type, credit, ...extra};
  r.out.push(o);
  // streaks
  if (type==='miss'){ r.streakMiss++; r.streakNo=0; }
  else if (type==='no'){ r.streakNo++; r.streakMiss=0; }
  else if (type==='yes'){ r.streakMiss=0; r.streakNo=0; r.streakUnd=0; }
  if (type==='undelivered'){ r.streakUnd++; } else if (type!=='withdrawn') { r.streakUnd = type==='undelivered'?r.streakUnd:0; }
  if (on('streak') && r.status==='available' && (r.streakMiss>=3 || r.streakNo>=5)){
    const why = r.streakMiss>=3 ? `${r.streakMiss} delivered misses in a row` : `${r.streakNo} declines in a row`;
    r.status='paused'; r.pauseWhy = why;
    pushLog(`${r.name} paused: ${why}. Asked to confirm availability; handler alerted.`);
  }
  if (on('move15') && r.streakUnd>=2 && r.status==='available'){
    r.status='unreachable'; pushLog(`${r.name} marked unreachable: 2 undelivered pings in a row. Handler alerted.`);
  }
  return o;
}

/* ============================================================
   ROUTING
   ============================================================ */
function travel(r, area){ if (r.area===area) return r.home; return (NEAR[area]&&NEAR[area][r.area]) || (NEAR[r.area]&&NEAR[r.area][area]) || 38; }
function rankFor(c, includeAll=false){
  const rows = S.R.filter(r=> includeAll || (r.status==='available' && !r.engaged)).map(r=>{
    const min = travel(r,c.area);
    const prox = min>=45 ? 0 : 1 - min/45;
    const raw = S.fixed ? rawScore(r) : r.old;
    const acc = histScore(r);
    const cap = c.need && c.need.length ? c.need.filter(t=>r.tags.includes(t)).length / c.need.length : 1;
    const total = 0.60*prox + 0.25*acc + 0.15*cap;
    return {r,min,prox,raw,acc,cap,total};
  }).filter(x=> !(on('capFilter') && x.cap<1));
  rows.sort((a,b)=>b.total-a.total);
  return rows;
}
function raise(area, opts={}){
  const c = {id:++S.nextId, area, need:opts.need||[], what:opts.what||'Incident reported', at:S.now, pings:[], state:'open', tried:new Set(opts.skip||[]), escalated:false, stopAfterOne:!!opts.stopAfterOne};
  S.callouts.unshift(c); S.lastCallout = c;
  pushLog(`Callout #${c.id} raised in ${area}${c.need.length?` (needs ${c.need.join(', ')})`:''}.`);
  nextPing(c); queueRender(); return c;
}
function nextPing(c){
  if (c.state!=='open') return;
  const primaries = c.pings.filter(p=>p.role==='primary').length;
  if (!S.fixed && c.stopAfterOne && primaries>=1){ c.state='unfilled'; pushLog(`Callout #${c.id} ended after one ping. Nobody else was asked.`); return; }
  if (on('escalate') && primaries>=3 && !c.escalated){ c.escalated=true; pushLog(`Callout #${c.id}: 3 pings without a yes. Handler alerted to override.`); }
  const cand = rankFor(c).find(x=>!c.tried.has(x.r.id));
  if (!cand){ c.state='unfilled'; pushLog(`Callout #${c.id} unfilled: nobody left to ask.`); return; }
  sendPing(c, cand.r, 'primary');
}
function sendPing(c, r, role){
  const p = {id:'p'+(S.pings.length+1), cid:c.id, rid:r.id, role, sentAt:S.now, deliveredAt:null, answeredAt:null, outcome:null, held:false, late:false, retried:false, attempt1Failed:false};
  c.tried.add(r.id); c.pings.push(p); S.pings.push(p);
  pushLog(`${role==='standby'?'Stand-by ping':'Ping'} sent to ${r.name} (${travel(r,c.area)} min away).`);
  if (on('notify')) S.toasts.push({kind:'ping', pid:p.id, rid:r.id});
  return p;
}
const calloutOf = p => S.callouts.find(c=>c.id===p.cid);
const activePings = () => S.pings.filter(p=>!p.outcome || p.held && !p.outcome);
function finish(p, type){
  if (p.outcome) return;
  const r = byId(p.rid), c = calloutOf(p);
  p.outcome = type; p.closedAt = S.now; S.maxOpen = Math.max(S.maxOpen, S.now-p.sentAt);
  let recType = type;
  if (type==='miss'){
    if (on('move15') && !p.deliveredAt) { recType = 'undelivered'; p.note = 'Never arrived: not counted'; }
    pushLog(`${r.name} missed the ping (${fmtT(S.now-p.sentAt)}).${p.note?' '+p.note+'.':''}`);
  }
  if (type==='undelivered'){ p.note='No delivery receipt in 15 s: moved on, not counted'; pushLog(`${r.name}: no delivery receipt after 15 s. Moved on, no penalty.`); }
  if (type!=='withdrawn') record(r, recType, {pid:p.id});
  else pushLog(`${r.name}'s ${p.role==='standby'?'stand-by ':''}ping withdrawn: covered by someone else. No effect on standing.`);
  // standby handling
  const sb = c.pings.find(x=>x.role==='standby' && (!x.outcome || x.held) && x.id!==p.id);
  if (c.state==='open' && p.role==='primary' && type!=='yes' && type!=='withdrawn'){
    if (sb && sb.held){ assign(c, sb); return; }
    if (sb){ sb.role='primary'; pushLog(`${byId(sb.rid).name} is now first in line.`); return; }
    nextPing(c);
  }
}
function assign(c, p){
  const r = byId(p.rid);
  p.outcome='yes'; p.held=false; p.answeredAt = p.answeredAt||S.now; p.closedAt=S.now;
  c.state='filled'; c.by=r.id; c.filledAt=S.now; r.engaged=true;
  record(r,'yes',{pid:p.id, cid:c.id});
  pushLog(`${r.name} took callout #${c.id} at ${fmtT(S.now-c.at)}.`);
  for (const o of c.pings) if (o!==p && (!o.outcome || o.held)){ o.held=false; finish(o,'withdrawn'); }
}
function answer(p, act){
  if (!p || p.outcome) return;
  const r = byId(p.rid), c = calloutOf(p);
  p.answeredAt = S.now;
  if (act==='yes'){
    if (c.state!=='open'){ return; }
    const primary = c.pings.find(x=>x.role==='primary' && !x.outcome);
    if (p.role==='standby' && primary){ p.held=true; pushLog(`${r.name} said yes on stand-by: "You're next, confirming shortly."`); queueRender(); return; }
    assign(c,p); queueRender(); return;
  }
  // decline
  const outA = on('outArea') && (r.area!==c.area || travel(r,c.area)>45);
  p.outcome='no'; p.closedAt=S.now; S.maxOpen = Math.max(S.maxOpen, S.now-p.sentAt);
  const o = record(r, outA?'no_out':'no', {pid:p.id});
  if (outA){ p.note='Outside your area: no effect on standing'; if (r.id===S.phoneRid) S.phoneNote={text:'Outside your area. This doesn\'t affect your standing.', until:Date.now()+6000}; }
  pushLog(`${r.name} declined after ${Math.round(S.now-p.sentAt)} s.${outA?' Out of area: not counted.':''}`);
  if (r.id===S.phoneRid && on('undo')) S.undo = {pid:p.id, until:Date.now()+5000, rec:o};
  if (p.role==='primary'){
    const sb = c.pings.find(x=>x.role==='standby' && (!x.outcome || x.held));
    if (sb && sb.held){ assign(c,sb); }
    else if (sb){ sb.role='primary'; }
    else nextPing(c);
  }
  queueRender();
}
function undoDecline(){
  if (!S.undo || Date.now()>S.undo.until) return;
  const p = S.pings.find(x=>x.id===S.undo.pid); const c = calloutOf(p); const r = byId(p.rid);
  if (c.state!=='open'){ S.undo=null; return; }
  if (S.undo.rec){ r.out.splice(r.out.indexOf(S.undo.rec),1); r.streakNo=Math.max(0,r.streakNo-1); }
  for (const o of c.pings) if (o!==p && (!o.outcome || o.held)){ o.held=false; finish(o,'withdrawn'); }
  p.outcome=null; S.undo=null;
  pushLog(`${r.name} changed "no" to accept within 5 s.`);
  assign(c,p); queueRender();
}
function releaseCallout(rid){
  const r = byId(rid); const c = S.callouts.find(x=>x.by===rid && x.state==='filled');
  if (!c) return;
  const p = c.pings.find(x=>x.rid===rid && x.outcome==='yes');
  c.state='open'; c.by=null; r.engaged=false;
  pushLog(`${r.name} released callout #${c.id} after accepting. It goes straight back out.`);
  if (S.fixed){
    const rec = r.out.slice().reverse().find(o=>o.type==='yes' && o.pid===p.id);
    if (on('release')) S.modal = {kind:'release', rid, cid:c.id, rec};
  }
  nextPing(c); queueRender();
}
function decideRelease(excused, reason){
  const m = S.modal; if (!m) return; const r = byId(m.rid);
  if (m.rec) m.rec.released = true;
  if (excused){ r.out.push({day:S.today,type:'release_ex',credit:0,reason}); pushLog(`Handler excused ${r.name}'s release: "${reason}". No penalty; the accept doesn't count either.`); }
  else { r.out.push({day:S.today,type:'release',credit:0}); pushLog(`Release not excused: ${r.name}'s accept credit removed and the release counts 1.5 against.`); }

let lastT = performance.now();
let PAUSED = false, pausedAt = 0, HOLD = false;
function setPaused(v){
  if (v === PAUSED) return;
  PAUSED = v;
  if (v) pausedAt = Date.now();
  else {
    const d = Date.now() - pausedAt;                 // shift real-time deadlines by the pause length
    if (S.undo) S.undo.until += d;
    if (S.phoneNote) S.phoneNote.until += d;
    lastT = performance.now();
  }
  document.getElementById('pauseBtn').textContent = PAUSED ? '▶' : '❚❚';
  document.getElementById('pauseBtn').classList.toggle('on', PAUSED);
  renderTop(); if (MODE==='walk') renderWalk();
}
function tick(){
  if (PAUSED || HOLD){ lastT = performance.now(); return; }
  const t = performance.now(); const dt = Math.min(1,(t-lastT)/1000); lastT = t;
  const step = dt * S.speed; let changed=false;
  if (S.pings.some(p=>!p.outcome) || S.unlocking){ S.now += step; changed=true; }
  for (const p of S.pings){
    if (p.outcome) continue;
    const r = byId(p.rid); const age = S.now - p.sentAt;
    if (!p.deliveredAt){
      if (r.online){
        if (r.dropFirst && !p.retried){
          if (!p.attempt1Failed && age>=1){ p.attempt1Failed=true; pushLog(`Push to ${r.name}: attempt 1 failed.`); }
          if (on('retry') && age>=3){ p.retried=true; p.deliveredAt=S.now; pushLog(`Retry with the same ping ID delivered to ${r.name} at 3 s. Shown once.`); }
        } else if (age>=r.delay){ p.deliveredAt=S.now; if (age>15) p.late=true; pushLog(`Delivered to ${r.name} at ${Math.round(age)} s.`); }
      }
      if (!p.deliveredAt && on('move15') && age>=15 && !p.held){ finish(p,'undelivered'); changed=true; continue; }
    }
    if (p.deliveredAt && r.id!==S.phoneRid && r.bot.act!=='none' && !p.held && S.now - p.deliveredAt >= r.bot.after){
      answer(p, r.bot.act); changed=true; continue;
    }
    const c = calloutOf(p);
    if (on('overlap') && p.role==='primary' && !p.standbyStarted && age>=45 && c.state==='open'){
      p.standbyStarted=true; const cand = rankFor(c).find(x=>!c.tried.has(x.r.id));
      if (cand) sendPing(c,cand.r,'standby');
    }
    if (!p.held && age>=60){ finish(p,'miss'); changed=true; }
    if (p.held && c.state==='open'){ const pr = c.pings.find(x=>x.role==='primary' && !x.outcome); if (!pr) { assign(c,p); changed=true; } }
  }
  if (S.unlocking && S.now >= S.unlocking){ S.unlocking=null; S.phoneLocked=false; pushLog('Phone unlocked.'); changed=true; }
  if (S.undo && Date.now()>S.undo.until){ S.undo=null; changed=true; }
  if (S.phoneNote && Date.now()>S.phoneNote.until){ S.phoneNote=null; changed=true; }
  if (changed || S.undo || S.phoneNote) queueRender();
}

/* Update a pane in place: only nodes that actually changed are touched, so
   animations don't restart and nothing flickers while the clock runs. */
function morph(el, html){
  const t = document.createElement('template'); t.innerHTML = html;
  patchChildren(el, t.content);
}
function patchChildren(a, b){
  const an = [...a.childNodes], bn = [...b.childNodes];
  for (let i=0; i<bn.length; i++){
    const x = an[i], y = bn[i];
    if (!x){ a.appendChild(y.cloneNode(true)); continue; }
    if (x.nodeType !== y.nodeType || x.nodeName !== y.nodeName){ a.replaceChild(y.cloneNode(true), x); continue; }
    if (x.nodeType !== 1){ if (x.nodeValue !== y.nodeValue) x.nodeValue = y.nodeValue; continue; }
    for (const at of [...x.attributes]) if (!y.hasAttribute(at.name)) x.removeAttribute(at.name);
    for (const at of [...y.attributes]) if (x.getAttribute(at.name) !== at.value) x.setAttribute(at.name, at.value);
    patchChildren(x, y);
  }
  for (let i=an.length-1; i>=bn.length; i--) a.removeChild(an[i]);

/* Spotlight: every item the narration calls out gets a box drawn around it,
   the rest of the page is dimmed, and the item is scrolled into view. */
function spotTab(spot){
  if (!spot) return null;
  if (spot.startsWith('row-')) return 'ranking';
  if (['meter','toMiddle','windowSel'].includes(spot)) return 'standing';
  if (spot.startsWith('tl-') || spot==='pingtable') return 'timeline';
  if (['maxopen','targets'].includes(spot)) return 'measures';
  if (spot==='switches' || spot.startsWith('sw-')) return 'switches';
  if (spot.startsWith('rc-') || spot.startsWith('call-') || ['deploynote','avrec','pauserow','signoff','tickets','chart','chart-weekly','chart-daily','chart-areas','checklist','roadmap','gate','notice'].includes(spot)) return 'ops';
  return null;
}
function findSpot(spot){
  if (!spot) return null;
  return document.querySelector(`[data-spot="${spot}"]`) || (spot.startsWith('#') ? document.querySelector(spot) : null);
}
let lastScrolled = null;
function applySpot(){
  const box = document.getElementById('spotbox');
  let el = findSpot(S.spot);
  // if the target isn't laid out at this screen size, box its nearest visible container instead
  while (el && el.getBoundingClientRect().width === 0) el = el.parentElement;
  if (!el){ box.classList.add('hidden'); return; }
  if (S.spot !== lastScrolled){ lastScrolled = S.spot; el.scrollIntoView({block:'center', inline:'nearest', behavior:'smooth'}); }
  const r = el.getBoundingClientRect(); const pad = 8;
  if (r.width === 0 && r.height === 0){ box.classList.add('hidden'); return; }
  box.style.left = (r.left - pad) + 'px'; box.style.top = (r.top - pad) + 'px';
  box.style.width = (r.width + pad*2) + 'px'; box.style.height = (r.height + pad*2) + 'px';
  box.classList.remove('hidden');
}
setInterval(applySpot, 60);
addEventListener('scroll', applySpot, {passive:true}); addEventListener('resize', applySpot);

function phonePing(){ return S.pings.find(x=>x.rid===S.phoneRid && (!x.outcome) && x.deliveredAt); }
function act(el){
  const a = el.dataset.act;
  if (a==='ans'){ answer(phonePing(), el.dataset.a); }
  else if (a==='fpAccept'){ const p=phonePing(); pushLog('Fingerprint confirmed on the lock screen.'); answer(p,'yes'); }
  else if (a==='unlock'){ if(!S.unlocking){ S.unlocking = S.now + 6; pushLog('Unlocking phone: Face ID, passcode, open the app…'); } }
  else if (a==='undo'){ undoDecline(); }
  else if (a==='release'){ releaseCallout(S.phoneRid); }
  else if (a==='onscene'){ onScene(S.phoneRid); }
  else if (a==='avail'){ const r=byId(el.dataset.rid); r.status='available'; r.streakMiss=0; r.streakNo=0; r.streakUnd=0; pushLog(`${r.name} confirmed available. Back in rotation.`); }
  else if (a==='excuse'){ decideRelease(true, el.dataset.why); }
  else if (a==='noexcuse'){ decideRelease(false); }
  else if (a==='override'){ const sel=document.getElementById('ovSel'); override(+el.dataset.cid, sel.value); }
  else if (a==='raise'){ raise(document.getElementById('raiseArea').value); }
  else if (a==='filter'){ const fl = S.signedIn==='main'?S.filters.active:S.coverFilters; const t=el.dataset.tag; const i=fl.indexOf(t); i>=0?fl.splice(i,1):fl.push(t); }
  else if (a==='clearFilters'){ if(S.signedIn==='main') S.filters.active=[]; else S.coverFilters=[]; pushLog('Filters cleared.'); }
  else if (a==='restoreFilters'){ S.filters.active=S.filters.restoreFrom; S.filters.restoreFrom=null; pushLog('Filters restored.'); }
  else if (a==='update'){ simulateUpdate(); }
  else if (a==='switchUser'){ S.signedIn = S.signedIn==='main'?'cover':'main'; pushLog(`Signed in as ${S.signedIn==='main'?S.handler:'covering handler'}: own filters loaded.`); }
  else if (a==='editTags'){ const r=byId(el.dataset.rid); const t=prompt(`Capability tags for ${r.name} (comma separated):`, r.tags.join(', ')); if(t!==null){ r.tags=t.split(',').map(s=>s.trim()).filter(Boolean); pushLog(`Handler updated ${r.name}'s tags (DR-20 phase 1).`);} }
  else if (a==='free'){ const r=byId(el.dataset.rid); r.engaged=false; const c=S.callouts.find(x=>x.by===r.id&&x.state==='filled'); if(c) c.state='done'; }
  else if (a==='tab'){ S.tab = el.dataset.tab; }
  else if (a==='window'){ S.windowDays = +el.dataset.d; }
  else if (a==='master'){ S.fixed = !S.fixed; pushLog(S.fixed?'Fixes turned on.':'Showing 4.2 as shipped.'); }
  else if (a==='sw'){ if(S.fixed){ S.sw[el.dataset.k] = !S.sw[el.dataset.k]; } }
  queueRender();
}
function simulateUpdate(){
  const fl = S.filters.active.slice();
  S.filters.active = [];
  if (on('filterSafe') && fl.length){ S.filters.restoreFrom = fl; pushLog('Overnight update reset saved filters. Handler warned, one-tap restore.'); }
  else pushLog('Overnight update reset saved filters silently.');
}

class Cancel extends Error{}
function ctxFor(token, step){
  const chk = ()=>{ if (token.cancel) throw new Cancel(); };
  const x = {
    // Each caption stays up long enough to read (~200 words/min + 1.5 s to find the highlight),
    // or, in "Click to continue" mode, until the presenter moves on.
    async say(text, spot=null, ms=null){
      chk(); S.spot = spot; caption(step.id, text); queueRender();
      if (PACE==='click'){ await x.waitContinue(); return; }
      const words = text.trim().split(/\s+/).length;
      await x.wait(Math.max(ms ?? 0, 1500 + words*300));
    },
    async waitContinue(){
      // hold the simulated clock while the presenter talks, so nothing times out behind them
      CONTINUE = false; HOLD = true; const t0 = Date.now();
      document.getElementById('capNext').classList.remove('hidden');
      try { while(!CONTINUE){ chk(); await new Promise(r=>setTimeout(r,80)); } }
      finally {
        const d = Date.now() - t0; if (S.undo) S.undo.until += d; if (S.phoneNote) S.phoneNote.until += d;
        HOLD = false; lastT = performance.now();
        document.getElementById('capNext').classList.add('hidden');
      }
    },
    async wait(ms){ let end = Date.now()+ms; while(Date.now()<end){ chk(); if(PAUSED){ end += 120; await new Promise(r=>setTimeout(r,120)); continue; } await new Promise(r=>setTimeout(r,60)); } chk(); },
    async until(pred, ms=60000){ let end=Date.now()+ms; while(!pred()){ chk(); if(PAUSED){ end += 120; await new Promise(r=>setTimeout(r,120)); continue; } if(Date.now()>end) return false; await new Promise(r=>setTimeout(r,60)); } return true; },
    speed(n){ S.speed=n; queueRender(); },
    reset(cfg){ freshWorld({...step.setup, ...cfg}); queueRender(); },
    raise(area, opts){ return raise(area, opts); },
    ping(rid){ return S.pings.slice().reverse().find(p=>p.rid===rid); },
    async delivered(rid){ await x.until(()=>{ const p=x.ping(rid); return p && p.deliveredAt!=null; }); return x.ping(rid); },
    async tap(spot, fn, pause=900){ S.spot = spot; queueRender(); await x.wait(pause); fn(); queueRender(); await x.wait(400); },
    set(fn){ fn(S); queueRender(); },
  };
  return x;
}
let PACE = 'auto', CONTINUE = false;
try{ PACE = localStorage.getItem('rook-pace') || 'auto'; }catch(e){}
document.getElementById('capNext').onclick = ()=>{ CONTINUE = true; };
addEventListener('keydown', e=>{
  if (MODE!=='walk') return;
  if ((e.key===' ' || e.key==='ArrowRight') && !document.getElementById('capNext').classList.contains('hidden') && !/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)){ e.preventDefault(); CONTINUE = true; }
});

function renderWalk(){
  const w = document.getElementById('walk');
  if (MODE==='free'){
    w.innerHTML = `<div class="grp">Free play</div><h2>Try it yourself</h2>
      <p class="note">Raise callouts from the console, answer on the phone, and flip any rule in the Switches tab. Other responders answer on their own.</p>
      <div class="free">
        <label>Rules</label><div class="seg" style="width:100%"><button class="${!S.fixed?'on':''}" data-free="old" style="flex:1">4.2 as shipped</button><button class="${S.fixed?'on':''}" data-free="new" style="flex:1">With fixes</button></div>
        <label>Handler at the console</label><select id="fHandler">${HANDLERS.map(h=>`<option ${S.handler===h?'selected':''}>${h}</option>`).join('')}</select>
        <label>Phone belongs to</label><select id="fPhone">${S.R.map(r=>`<option value="${r.id}" ${S.phoneRid===r.id?'selected':''}>${r.name}</option>`).join('')}</select>
        <label>Raise a callout</label><div style="display:flex;gap:6px"><select id="fArea">${AREAS.map(a=>`<option>${a}</option>`).join('')}</select><select id="fNeed"><option value="">any skill</option>${TAGS.map(t=>`<option>${t}</option>`).join('')}</select></div>
        <button class="btn primary" style="width:100%;margin-top:8px" id="fRaise">Raise callout</button>
        <label>Phone</label>
        <div style="display:flex;gap:6px"><button class="btn" style="flex:1" id="fLock">${S.phoneLocked?'Unlock screen':'Lock screen'}</button><button class="btn" style="flex:1" id="fSignal">${byId(S.phoneRid).online?'Lose signal':'Restore signal'}</button></div>
        <button class="btn" style="width:100%;margin-top:8px" id="fReset">Reset world</button>
      </div>`;
    w.querySelector('[data-free="old"]').onclick=()=>{S.fixed=false;renderWalk();queueRender();};
    w.querySelector('[data-free="new"]').onclick=()=>{S.fixed=true;renderWalk();queueRender();};
    w.querySelector('#fHandler').onchange=e=>{S.handler=e.target.value;queueRender();};
    w.querySelector('#fPhone').onchange=e=>{S.phoneRid=e.target.value;renderWalk();queueRender();};
    w.querySelector('#fRaise').onclick=()=>{const n=w.querySelector('#fNeed').value; raise(w.querySelector('#fArea').value,{need:n?[n]:[]}); };
    w.querySelector('#fLock').onclick=()=>{S.phoneLocked=!S.phoneLocked;renderWalk();queueRender();};
    w.querySelector('#fSignal').onclick=()=>{const r=byId(S.phoneRid); r.online=!r.online; if(r.online&&r.status==='unreachable'){r.status='available';r.streakUnd=0;pushLog(`${r.name}'s app checked in.`);} renderWalk();queueRender();};
    w.querySelector('#fReset').onclick=()=>{freshWorld({fixed:S.fixed,handler:S.handler,phone:S.phoneRid});renderWalk();queueRender();};
    return;
  }
  const s = STEPS[STEP];
  const groups = [...new Set(STEPS.map(x=>x.group))];
  w.innerHTML = `
    <div class="grp">Walkthrough · ${STEP+1} of ${STEPS.length}</div>
    <div class="progress"><i style="width:${(STEP+1)/STEPS.length*100}%"></i></div>
    <select class="stepsel" id="stepSel">${groups.map(g=>`<optgroup label="${g}">${STEPS.map((x,i)=>x.group===g?`<option value="${i}" ${i===STEP?'selected':''}>${x.id} · ${x.title}</option>`:'').join('')}</optgroup>`).join('')}</select>
    <h2><span class="rid">${s.id}</span>${s.title}</h2>
    <div>${s.pri?`<span class="pri">${s.pri}</span>`:''} <span class="grp" style="margin-left:4px">${s.group}</span></div>
    <div class="blk"><h4>Problem</h4><p>${s.problem}</p></div>
    <div class="blk"><h4>Job to be done</h4><p class="jtbd">${s.jtbd}</p></div>
    <div class="blk"><h4>How it's solved</h4><p>${s.solved}</p></div>
    ${s.goals.length?`<div class="blk"><h4>Goal check</h4><div class="chips">${s.goals.map(g=>`<span class="chip ${g.includes('✅')?'g':g.includes('➖')?'':'w'}">${g}</span>`).join('')}</div></div>`:''}
    ${s.criteria.length?`<details ${STEP===0?'open':''}><summary>Acceptance criteria</summary><ul class="tight">${s.criteria.map(c=>`<li>${c}</li>`).join('')}</ul></details>`:''}
    ${s.whatif.length?`<details><summary>What-if checks</summary><ul class="tight">${s.whatif.map(c=>`<li>${c}</li>`).join('')}</ul></details>`:''}
    <div class="ctrl"><button class="btn" id="prevBtn" ${STEP===0?'disabled':''}>◀</button><button class="btn primary" id="playBtn">${RUN&&!RUN.done?(PAUSED?'▶ Resume':'❚❚ Pause'):'▶ Simulate'}</button><button class="btn" id="replayBtn" title="Restart this step">↺</button><button class="btn" id="nextBtn" ${STEP===STEPS.length-1?'disabled':''}>Next ▶</button></div>
    <div class="pace">Pace <div class="seg"><button data-pace="auto" class="${PACE==='auto'?'on':''}">Auto</button><button data-pace="click" class="${PACE==='click'?'on':''}">Click to continue</button></div></div>`;
  w.querySelectorAll('[data-pace]').forEach(b=>b.onclick=()=>{ PACE=b.dataset.pace; try{localStorage.setItem('rook-pace',PACE);}catch(e){} if(PACE==='auto') CONTINUE=true; renderWalk(); });
  w.querySelector('#stepSel').onchange = e=> goStep(+e.target.value);
  w.querySelector('#prevBtn').onclick = ()=> goStep(STEP-1);
  w.querySelector('#nextBtn').onclick = ()=> goStep(STEP+1, true);
  w.querySelector('#replayBtn').onclick = ()=> goStep(STEP, true);
  w.querySelector('#playBtn').onclick = ()=>{
    if (RUN && !RUN.done){ setPaused(!PAUSED); return; }
    play();
  };
}
function goStep(i, autoplay=false){
  if (i<0||i>=STEPS.length) return;
  if (RUN) RUN.cancel = true; RUN=null;
  setPaused(false); lastScrolled = null;
  STEP = i; const s = STEPS[i];
  freshWorld(s.setup); S.spot=null;
  document.getElementById('caption').classList.add('hidden');
  renderWalk(); queueRender();
  try{ history.replaceState(null,'','#'+s.id); }catch(e){}
  if (autoplay) setTimeout(play, 350);
}
async function play(){
  const s = STEPS[STEP];
  if (RUN) RUN.cancel = true;
  setPaused(false); lastScrolled = null;
  freshWorld(s.setup);
  const token = {cancel:false, paused:false, done:false}; RUN = token; renderWalk();
  try{
    await s.script(ctxFor(token, s));
    if (!token.cancel){ token.done=true; S.spot=null; caption(s.id, STEP<STEPS.length-1 ? `Done. Next: ${STEPS[STEP+1].id} · ${STEPS[STEP+1].title} ▶` : 'End of walkthrough.'); }
  }catch(e){ if (!(e instanceof Cancel)) { console.error(e); caption(s.id,'Something went wrong in this simulation: '+e.message); } }
  S.speed=1; renderWalk(); queueRender();
}

/* ============================================================
   TOP BAR
   ============================================================ */
document.querySelectorAll('#modeSeg button').forEach(b=>b.onclick=()=>{
  MODE=b.dataset.mode; document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.toggle('on',x===b));
  if (RUN) RUN.cancel=true; RUN=null; setPaused(false); document.getElementById('caption').classList.add('hidden');
  if (MODE==='free'){ freshWorld({fixed:true, handler:'Aunt Dot', phone:'vesper', tab:'ranking'}); }
  else goStep(STEP);
  renderWalk(); queueRender();
});
document.querySelectorAll('#speedSeg button[data-speed]').forEach(b=>b.onclick=()=>{ S.speed=+b.dataset.speed; queueRender(); });
document.getElementById('pauseBtn').onclick = ()=> setPaused(!PAUSED);
document.getElementById('themeBtn').onclick=()=>{
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  document.documentElement.dataset.theme = cur==='dark'?'light':'dark';
  try{ localStorage.setItem('rook-theme', document.documentElement.dataset.theme); }catch(e){}
};
try{ const t=localStorage.getItem('rook-theme'); if(t) document.documentElement.dataset.theme=t; }catch(e){}

const startIdx = Math.max(0, STEPS.findIndex(s=>'#'+s.id===location.hash));
goStep(startIdx);
setInterval(tick, 50);
</script>
